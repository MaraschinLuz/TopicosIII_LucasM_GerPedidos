<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        <h:outputText value="Cadastro de Produto" />
    </ui:define>

    <ui:define name="content">
        <h:form id="frmList">
            <p:fieldset legend="Produtos Cadastrados" toggleable="true">
                <p:dataTable id="datalist" value="#{produtoController.produtoList}" var="item"
                             selectionMode="single" selection="#{produtoController.selected}"
                             rowKey="#{item.id}" widgetVar="datalistProdutoWidgetVar"
                             paginator="true" rows="5" rowsPerPageTemplate="5,10,50,100"
                             emptyMessage="Nenhum produto cadastrado...">

                    <p:ajax event="rowSelect" update="btnEdit btnDelete btnView"/>
                    <p:ajax event="rowUnselect" update="btnEdit btnDelete btnView"/>

                    <p:column headerText="ID" width="5%" sortBy="#{item.id}" filterBy="#{item.id}">
                        <h:outputText value="#{item.id}" />
                    </p:column>

                    <p:column headerText="Nome" sortBy="#{item.nome}" filterBy="#{item.nome}">
                        <h:outputText value="#{item.nome}" />
                    </p:column>

                    <p:column headerText="Descrição" sortBy="#{item.descricao}" filterBy="#{item.descricao}">
                        <h:outputText value="#{item.descricao}" />
                    </p:column>

                    <p:column headerText="Preço" sortBy="#{item.preco}" filterBy="#{item.preco}">
                        <h:outputText value="#{item.preco}">
                            <f:convertNumber type="currency" currencySymbol="R$"/>
                        </h:outputText>
                    </p:column>

                    <f:facet name="footer">
                        <p:commandButton id="btnCreate" value="Incluir Produto" icon="pi pi-plus"
                                         onclick="PF('dlgCreate').show()" styleClass="ui-button-success"/>

                        <p:commandButton id="btnEdit" value="Editar Produto" icon="pi pi-pencil"
                                         update="formEdit" oncomplete="PF('dlgEdit').show()"
                                         disabled="#{empty produtoController.selected}" styleClass="ui-button-warning"/>

                        <p:commandButton id="btnDelete" value="Excluir Produto" icon="pi pi-trash"
                                         actionListener="#{produtoController.deletarProduto()}" update="frmList"
                                         disabled="#{empty produtoController.selected}" styleClass="ui-button-danger">
                            <p:confirm header="Confirmar Exclusão"
                                       message="Deseja realmente excluir o produto selecionado?"
                                       icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>

                        <p:commandButton id="btnView" value="Visualizar" icon="pi pi-eye"
                                         update="formView" oncomplete="PF('dlgView').show()"
                                         disabled="#{empty produtoController.selected}"/>
                    </f:facet>
                </p:dataTable>
            </p:fieldset>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times"/>
            </p:confirmDialog>
        </h:form>

        <!-- Diálogo de Cadastro -->
        <p:dialog header="Cadastrar Produto" widgetVar="dlgCreate" modal="true" resizable="false" width="500">
            <h:form id="CreateForm">
                <h:panelGrid columns="2" columnClasses="label,value" styleClass="ui-panelgrid-blank">

                    <p:outputLabel for="iptNome" value="Nome:" />
                    <p:inputText id="iptNome" value="#{produtoController.produto.nome}" required="true"
                                 requiredMessage="Informe o nome do produto" maxlength="100"/>

                    <p:outputLabel for="iptDescricao" value="Descrição:" />
                    <p:inputTextarea id="iptDescricao" value="#{produtoController.produto.descricao}"
                                     maxlength="255" rows="3"/>

                    <p:outputLabel for="iptPreco" value="Preço:" />
                    <p:inputText id="iptPreco" value="#{produtoController.produto.preco}" required="true"
                                 requiredMessage="Informe o preço do produto">
                        <f:convertNumber locale="pt_BR" minFractionDigits="2" maxFractionDigits="2"/>
                    </p:inputText>

                </h:panelGrid>

                <p:separator/>
                <p:commandButton value="Salvar" icon="pi pi-check" action="#{produtoController.adicionarProduto()}"
                                 update="@form, frmList" onclick="PF('dlgCreate').hide()" styleClass="ui-button-success"/>
            </h:form>
        </p:dialog>

        <!-- Diálogo de Edição -->
        <p:dialog header="Editar Produto" widgetVar="dlgEdit" modal="true" resizable="false" width="500">
            <h:form id="formEdit">
                <h:panelGrid columns="2" columnClasses="label,value" styleClass="ui-panelgrid-blank">

                    <p:outputLabel for="iptId" value="ID:" />
                    <p:inputText id="iptId" value="#{produtoController.selected.id}" disabled="true"/>

                    <p:outputLabel for="iptNome" value="Nome:" />
                    <p:inputText id="iptNome" value="#{produtoController.selected.nome}" required="true"
                                 requiredMessage="Informe o nome" maxlength="100"/>

                    <p:outputLabel for="iptDescricao" value="Descrição:" />
                    <p:inputTextarea id="iptDescricao" value="#{produtoController.selected.descricao}"
                                     maxlength="255" rows="3"/>

                    <p:outputLabel for="iptPreco" value="Preço:" />
                    <p:inputText id="iptPreco" value="#{produtoController.selected.preco}" required="true"
                                 requiredMessage="Informe o preço">
                        <f:convertNumber locale="pt_BR" minFractionDigits="2" maxFractionDigits="2"/>
                    </p:inputText>

                </h:panelGrid>

                <p:separator/>
                <p:commandButton value="Salvar" icon="pi pi-save" action="#{produtoController.editarProduto()}"
                                 update="@form, frmList" onclick="PF('dlgEdit').hide()" styleClass="ui-button-primary"/>
            </h:form>
        </p:dialog>

        <!-- Diálogo de Visualização -->
        <p:dialog header="Detalhes do Produto" widgetVar="dlgView" modal="true" resizable="false" width="400">
            <h:form id="formView">
                <h:panelGrid columns="2" columnClasses="label,value" styleClass="ui-panelgrid-blank">
                    <p:outputLabel value="ID:" />
                    <p:outputLabel value="#{produtoController.selected.id}" />

                    <p:outputLabel value="Nome:" />
                    <p:outputLabel value="#{produtoController.selected.nome}" />

                    <p:outputLabel value="Descrição:" />
                    <p:outputLabel value="#{produtoController.selected.descricao}" />

                    <p:outputLabel value="Preço:" />
                    <h:outputText value="#{produtoController.selected.preco}">
                        <f:convertNumber type="currency" currencySymbol="R$"/>
                    </h:outputText>
                </h:panelGrid>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
